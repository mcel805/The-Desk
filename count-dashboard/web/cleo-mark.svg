<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 205" role="img" aria-labelledby="title desc">
  <title id="title">CLEO, grey and black tabby</title>
  <desc id="desc">A hand-drawn sitting tabby cat with a soft grey watercolor coat, dark stripes, pale muzzle, and green eyes.</desc>
  <defs>
    <path id="head" d="M37 37 77 63c10-6 22-7 34-1l41-26-8 60c-3 23-19 36-43 38-25 2-47-7-54-29-4-12-7-38-10-68Z"/>
    <path id="body" d="M57 128c-7 8-12 18-10 27 1 8 7 13 15 13 5 0 9-3 12-8 5 5 12 8 22 8 10 0 19-2 27-5 7 4 16 3 21-2 7-7 4-17 0-24-4-7-10-12-16-16-12 6-34 8-49 4-7-2-14-1-22 3Z"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>
    <linearGradient id="fur" x1=".14" y1=".06" x2=".88" y2=".94">
      <stop stop-color="#c5c6c4"/><stop offset=".46" stop-color="#898c8d"/><stop offset="1" stop-color="#585b5d"/>
    </linearGradient>
    <radialGradient id="cream" cx=".5" cy=".42" r=".72">
      <stop stop-color="#f2f0e9" stop-opacity=".98"/><stop offset="1" stop-color="#c9c9c4" stop-opacity=".8"/>
    </radialGradient>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
  </defs>

  <!-- Grey watercolor coat and soft tabby markings, clipped to the hand-drawn silhouette. -->
  <g filter="url(#wash)">
    <g clip-path="url(#headClip)">
      <use href="#head" fill="url(#fur)"/>
      <path d="M31 40c18 1 31 15 46 22 11 5 21-6 37-14 9-5 17-7 27-5l-8 48c-8 21-23 29-44 29-26-1-43-10-49-28Z" fill="#d2d2cf" opacity=".25"/>
      <!-- forehead M and cheek stripes -->
      <path d="M70 57c4-8 9-14 16-19 0 10-2 18-6 25m12-6c3-8 8-14 15-18 0 9-2 17-6 23m10 3c5-6 12-10 19-12-3 9-7 15-13 20" fill="none" stroke="#343638" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".83"/>
      <path d="M46 91c8-4 17-5 25-2m-24 12c8-4 16-4 23-1m51-9c8-4 16-5 24-5m-25 17c8-3 16-4 24-3" fill="none" stroke="#383a3b" stroke-width="4" stroke-linecap="round" opacity=".78"/>
      <path d="M58 102c8-2 15 0 20 5 5 5 10 6 15 2 5-5 10-8 17-8 7 0 13 2 19 6-5 15-18 23-35 24-18 1-32-7-36-21Z" fill="url(#cream)" opacity=".9"/>
    </g>
    <g clip-path="url(#bodyClip)">
      <use href="#body" fill="url(#fur)"/>
      <path d="M48 135c11-6 20-7 30-2 12 6 23 8 39 2 10-4 17-4 25 0l-1 29-83 8Z" fill="#d1d1ce" opacity=".28"/>
      <path d="M67 131c-5 7-8 14-8 22m22-22c-2 8-2 16 1 23m18-21c2 7 5 13 10 18m13-20c5 5 8 10 10 16" fill="none" stroke="#3b3d3e" stroke-width="4" stroke-linecap="round" opacity=".69"/>
    </g>
  </g>

  <!-- Bold, slightly irregular ink contours echo the supplied sketch. -->
  <g fill="none" stroke="#252725" stroke-linecap="round" stroke-linejoin="round">
    <use href="#head" stroke-width="5.4"/>
    <path d="m42 43 33 22m68-21-30 20" stroke-width="1.8" opacity=".48"/>
    <path d="M67 87c.1 0 .1 0 .2 0m41 0c.1 0 .1 0 .2 0" stroke-width="7"/>
    <path d="m81 103 7-3 7 3-7 5Z" fill="#8e7775" stroke-width="1.2"/>
    <path d="M88 108v7m0 0c-5 6-11 6-16 1m16-1c5 6 11 6 16 1" stroke-width="3.1"/>
    <path d="m68 104-24-5m25 12-25 1m75-8 24-5m-25 12 25 1" stroke-width="2.1"/>
    <use href="#body" stroke-width="4.8"/>
    <path d="M48 132c-7 8-12 18-9 25 2 6 8 9 15 9m-1-33c-6 8-8 16-5 22m76-22c7 6 12 14 11 22-1 6-6 10-13 9m-66-2c7 4 12 3 17-3m44 2c-8 4-15 4-23 3" stroke-width="4.6"/>
  </g>
  <g aria-hidden="true">
    <circle cx="67" cy="87" r="3.4" fill="#849477" stroke="#252725" stroke-width=".9"/>
    <circle cx="108" cy="87" r="3.4" fill="#849477" stroke="#252725" stroke-width=".9"/>
  </g>
</svg>
