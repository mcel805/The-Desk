<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Choose how you’ll text Cleo when messaging is ready." />
    <title>Start texting Cleo</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #111214;
        --muted: #77797d;
        --line: #e4e5e8;
        --green: #00c853;
        --focus: #5b9f90;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 22px;
        background: #fff;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main { width: min(100%, 472px); margin-top: -18px; }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 4vw, 42px);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.045em;
      }

      .intro { margin: 16px 0 42px; color: var(--muted); font-size: 18px; line-height: 1.5; }

      .tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border-bottom: 1px solid var(--line);
      }

      .tab {
        min-width: 0;
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 16px;
      }

      .tab[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 650; }
      .tab:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

      .channel-icon {
        width: 32px;
        height: 32px;
        display: grid;
        flex: 0 0 32px;
        place-items: center;
        border-radius: 9px;
        background: var(--green);
        color: #fff;
      }

      .channel-icon svg { width: 22px; height: 22px; }

      .qr-placeholder {
        width: 224px;
        aspect-ratio: 1;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 13px;
        margin: 28px auto 20px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--muted);
        text-align: center;
      }

      .phone-icon { width: 42px; height: 42px; color: #a1a3a6; }
      .qr-placeholder p { max-width: 150px; margin: 0; font-size: 14px; line-height: 1.45; }

      .caption { margin: 0 0 14px; color: var(--muted); font-size: 16px; line-height: 1.5; text-align: center; }

      .contact-placeholder {
        min-height: 62px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--muted);
        font-size: 16px;
      }

      .back { display: block; width: fit-content; margin: 24px auto 0; color: #595b5e; font-size: 15px; text-underline-offset: 3px; }

      @media (max-width: 420px) {
        main { margin-top: -6px; }
        .intro { margin-bottom: 32px; }
        .tab { gap: 8px; font-size: 14px; }
        .channel-icon { width: 29px; height: 29px; flex-basis: 29px; }
        .qr-placeholder { width: min(224px, 68vw); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Start texting Cleo</h1>
      <p class="intro">You can reach Cleo on iMessage or WhatsApp.</p>

      <div class="tabs" role="tablist" aria-label="Choose a messaging app">
        <button class="tab" type="button" role="tab" id="tab-imessage" aria-selected="true" aria-controls="channel-panel" data-channel="iMessage">
          <span class="channel-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.1c-5.1 0-9.2 3.5-9.2 7.9 0 2.3 1.2 4.4 3.2 5.8l-.9 3.4 4-2c.9.3 1.9.5 2.9.5 5.1 0 9.2-3.5 9.2-7.8S17.1 3.1 12 3.1Z" fill="currentColor"/></svg></span>
          <span>iMessage</span>
        </button>
        <button class="tab" type="button" role="tab" id="tab-whatsapp" aria-selected="false" aria-controls="channel-panel" data-channel="WhatsApp" tabindex="-1">
          <span class="channel-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.2 11.6a8.2 8.2 0 0 1-12.1 7.2L3 20l1.3-4.9a8.2 8.2 0 1 1 15.9-3.5Z"/><path d="M8.4 7.8c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.7c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4 0 .7.5.9 1.2 1.6 2.1 2.1.3.2.5.2.7-.1l.7-.8c.2-.2.4-.3.7-.2l1.6.8c.3.1.4.3.4.6 0 .4-.2 1.2-.8 1.7-.5.5-1.4.7-2.3.4-1-.3-2.4-.9-3.8-2.2-1.2-1-2-2.4-2.3-3.3-.3-.9-.1-1.8.3-2.3.3-.4.6-.6.9-.7Z" fill="currentColor" stroke="none"/></svg></span>
          <span>WhatsApp</span>
        </button>
      </div>

      <section id="channel-panel" role="tabpanel" aria-labelledby="tab-imessage" aria-live="polite">
        <div class="qr-placeholder" aria-label="QR code placeholder">
          <svg class="phone-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="12" y="4" width="24" height="40" rx="5" stroke="currentColor" stroke-width="2.5"/><path d="M20 9h8M21 38h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          <p id="qr-label">iMessage QR code will appear here</p>
        </div>
        <p class="caption">Scan with your phone’s camera or text this number</p>
        <div class="contact-placeholder" id="contact-label">Cleo number coming soon</div>
      </section>

      <a class="back" href="avatar.html">Back</a>
    </main>

    <script>
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panel = document.getElementById("channel-panel");
      const label = document.getElementById("qr-label");
      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectTab(tab));
        tab.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          const next = tabs[(index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
          selectTab(next);
          next.focus();
        });
      });

      function selectTab(tab) {
        tabs.forEach((item) => {
          const selected = item === tab;
          item.setAttribute("aria-selected", String(selected));
          item.tabIndex = selected ? 0 : -1;
        });
        panel.setAttribute("aria-labelledby", tab.id);
        label.textContent = `${tab.dataset.channel} QR code will appear here`;
      }
    </script>
  </body>
</html>
