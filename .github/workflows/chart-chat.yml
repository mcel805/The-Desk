name: Chart chat

on:
  pull_request:
    paths:
      - 'apps/the-desk/**'
      - '.github/workflows/chart-chat.yml'
  push:
    branches: [main]
    paths:
      - 'apps/the-desk/**'
      - '.github/workflows/chart-chat.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/the-desk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Python research and specialist regressions
        run: |
          python -m unittest discover -s tests -p test_chart_chat.py -v
          python -m unittest discover -s tests -p 'test_spider*.py' -v
      - name: Swing and storage regressions
        run: |
          python -m unittest discover -s tests -p 'test_swing*.py' -v
          python -m unittest discover -s tests -p test_house_abc.py -v
          python -m unittest discover -s tests -p 'test_storage*.py' -v
          python -m unittest discover -s tests -p test_startup_integrity.py -v
          python -m unittest discover -s tests -p test_data_http.py -v
          python -m unittest discover -s tests -p test_jev_costs.py -v
          python -m unittest discover -s tests -p test_jev_reliability.py -v
      - name: Chart and drawing regressions
        run: node --test tests/test_chart_chat_model.mjs tests/test_spider*.mjs tests/test_chart_menu_actions.mjs tests/test_chart_brackets.mjs
      - name: Swing display and workspace recovery
        run: node --test tests/test_house_abc_view.mjs tests/test_house_abc_pine.mjs tests/test_swing_dots.mjs tests/test_swing_warning_view.mjs tests/test_polling.mjs tests/test_durable_settings.mjs tests/test_workspace_mirror.mjs
      - name: Syntax
        run: |
          python -m py_compile chart_chat.py server.py swing_advisors.py
          node --check web/chart-chat.mjs
          node --check web/chart-chat-labels.mjs
