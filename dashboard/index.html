<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batty · Chart Sessions</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#sessions"><span class="mark">B</span>BATTY <small>CHART SESSIONS</small></a><span class="local">On this device · Snapshot analysis</span><button id="newSession">+ New session</button></header>
<main id="app" aria-live="polite"></main><div id="toast" role="status"></div>
<dialog id="newDialog"><form id="sessionForm"><div class="dialoghead"><h2>File a chart session</h2><button type="button" id="closeDialog" aria-label="Close">×</button></div><p>Save original chart images by date. New charts start with analysis pending.</p><label>Session date<input type="date" id="sessionDate" required></label><label>Asset<input id="asset" placeholder="e.g. MYM1!" maxlength="40" required></label><div id="uploadFields"></div><p class="muted">Saved in this browser on this device. No images leave your computer. Export a session to keep a portable copy.</p><p id="formError" role="alert"></p><button class="primary" type="submit">Save session</button></form></dialog>
<script type="module" src="app.js"></script></body></html>
